<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Redirecting...</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="{{ page.extra.redirect_to }}">
    <style>
        :root {
            --bg-color: #ffffff;
            --fg-color: #1a1a1a;
            --link-color: #7b4397;
            --muted-color: #666666;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --fg-color: #f0f0f0;
                --link-color: #c988e7;
                --muted-color: #999999;
            }
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--fg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
            text-align: center;
        }

        .redirect-box {
            max-width: 480px;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(128, 128, 128, 0.25);
            border-radius: 50%;
            border-top-color: var(--link-color);
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        p {
            margin: 0.5rem 0;
            line-height: 1.5;
        }

        a {
            color: var(--link-color);
            text-decoration: underline;
            word-break: break-all;
        }

        .url-text {
            color: var(--muted-color);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
    </style>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-70KXRZ7CZM"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-70KXRZ7CZM', { 'send_page_view': true });

        const targetUrl = "{{ page.extra.redirect_to | safe }}";
        let redirected = false;

        function redirect() {
            if (!redirected) {
                redirected = true;
                window.location.replace(targetUrl);
            }
        }

        // Send affiliate_redirect event to GA4
        gtag('event', 'affiliate_redirect', {
            'event_category': 'affiliate',
            'event_label': window.location.pathname,
            'destination_url': targetUrl,
            'event_callback': redirect
        });

        // Fallback in case GA is blocked or takes too long to respond
        setTimeout(redirect, 500);
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url={{ page.extra.redirect_to }}">
    </noscript>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <p>Redirecting to <a href="{{ page.extra.redirect_to }}">{{ page.extra.redirect_to }}</a>...</p>
    </div>
</body>
</html>
